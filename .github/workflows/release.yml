name: Release

# Two ways to trigger this workflow:
#
#   1. Push a tag like `v0.1.0` from your machine:
#        git tag v0.1.0 -m "..."
#        git push origin v0.1.0
#
#   2. Click "Run workflow" in the Actions tab of the repo and type
#      the version (e.g. `0.1.0`). Useful when you're on a machine
#      without git, or when you'd rather do it from the browser.
#
# What this builds per platform:
#
#   - Windows: `flet pack` produces a single `.exe` with PyInstaller.
#       Distributed as-is. Runs on Win10/11 x64.
#
#   - Linux: `flet pack` produces a PyInstaller bundle. We then wrap
#       it in an AppImage so dependencies that vary across distros
#       (libpango, libfontconfig, libgtk, libmpv, ...) are shipped
#       inside the AppImage instead of inherited from the user's
#       system. This avoids the "undefined symbol" class of bugs that
#       hits modern rolling-release distros (Arch, CachyOS, Fedora 41+)
#       where Pango is newer than the runner's bundled fontconfig.
#       The AppImage works on any glibc >= 2.31 with FUSE 2 installed.
#
# Both flows run pytest first as a gate, then upload the platform
# asset to the same GitHub Release tag (auto-created from the version).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0 — without the v prefix, it is added automatically)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

# We need write access to push the release + assets + tag.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name_template: switch-queue-copy-{version}-windows-x64.exe
            built_path: dist/Switch Queue Copy.exe
          # We pin ubuntu-22.04 (not ubuntu-latest) because linuxdeploy
          # and AppImage tooling are most stable there, and binaries
          # built against the older glibc/Pango run on newer distros
          # without ABI breaks. Bumping past 22.04 historically broke
          # AppImage compatibility on older user systems.
          - os: ubuntu-22.04
            asset_name_template: switch-queue-copy-{version}-linux-x86_64.AppImage
            built_path: dist/Switch-Queue-Copy-x86_64.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Flet on Linux uses `flet build linux` (which under the hood drives
      # Flutter + serious_python) instead of `flet pack`. That toolchain
      # needs the full GTK / GStreamer / libmpv stack at *build* time so
      # the Flutter Linux runtime compiles, plus the AppImage tooling we
      # use afterwards to wrap the result for cross-distro distribution.
      #
      # System libs derived from Flet's canonical all-builds workflow:
      #   https://github.com/ndonkoHenri/flet-github-action-workflows
      - name: Install Linux system libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update --allow-releaseinfo-change
          # libunwind-dev is explicitly listed because it's "held" on the
          # ubuntu-22.04 runner image — without it, libgstreamer1.0-dev fails
          # to install with "you have held broken packages."
          sudo apt-get install -y --no-install-recommends \
            clang ninja-build cmake pkg-config libunwind-dev \
            libgtk-3-dev libayatana-appindicator3-1 \
            libasound2-dev libmpv-dev mpv \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-tools gstreamer1.0-x gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-gtk3 \
            gstreamer1.0-pulseaudio libsecret-1-0 libsecret-1-dev \
            libfuse2 desktop-file-utils patchelf wget

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (gate)
        run: pytest -v

      - name: Compute version + tag
        id: version
        shell: bash
        run: |
          # We accept two trigger flavours:
          #   - workflow_dispatch: read the input (e.g. "0.1.0" — strip leading v if user added it)
          #   - tag push (refs/tags/v0.1.0): take github.ref_name and strip v for the embedded version
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW='${{ inputs.version }}'
            VERSION="${RAW#v}"
            TAG="v$VERSION"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          # Minimal sanity check — SemVer X.Y.Z (optionally followed by -rc1, -beta, etc.)
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::Version '$VERSION' is not valid SemVer (expected X.Y.Z[-suffix])."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION (tag $TAG)"

      # ------------------------------------------------------------------
      # Windows uses `flet pack` (PyInstaller). It's working today and the
      # Pango/fontconfig ABI mismatch that motivated this whole refactor
      # only affects Linux, so we leave the Windows path alone.
      # ------------------------------------------------------------------
      - name: Build with flet pack (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # We pass main.py (top-level launcher) rather than the package's
        # __main__.py so that absolute imports work in the bundled
        # context — PyInstaller doesn't preserve `python -m`-style
        # __package__ semantics. See main.py docstring.
        run: |
          flet pack main.py \
            --name "Switch Queue Copy" \
            --product-name "Switch Queue Copy" \
            --product-version "${{ steps.version.outputs.version }}" \
            --file-version "${{ steps.version.outputs.version }}" \
            --yes

      # ------------------------------------------------------------------
      # Linux uses `flet build linux` (Flutter + serious_python). Unlike
      # `flet pack`, this produces a fully self-contained Linux bundle —
      # the Flutter desktop client (`flet_view`) is built in, so users
      # don't get a runtime download attempt with an SSL error on launch.
      #
      # Auto-downloads the Flutter SDK on first run (cached in $HOME/flutter/).
      # ------------------------------------------------------------------
      - name: Build with flet build linux (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          flet build linux \
            --module-name main \
            --project switch_queue_copy \
            --product "Switch Queue Copy" \
            --artifact switch_queue_copy \
            --build-version "${{ steps.version.outputs.version }}" \
            --no-android-splash --no-ios-splash --no-web-splash \
            --yes --no-rich-output
          echo "=== Inspecting flet build linux output ==="
          find build/linux -maxdepth 4 -type d
          echo "---"
          find build/linux -maxdepth 4 -type f -executable -not -name '*.so*' | head -20

      # =====================================================================
      # Linux-only: wrap the Flutter bundle produced by `flet build linux`
      # in an AppImage so system libs (libgtk-3, libmpv, libpango, ...) that
      # vary across distros travel WITH the artifact instead of being
      # inherited from the user's system at runtime.
      #
      # Tools:
      #   - linuxdeploy: walks the binary's ELF deps and copies system libs
      #   - appimagetool: produces the final single-file .AppImage
      #
      # Bundle layout from `flet build linux` (Flutter convention):
      #   build/linux/x64/release/bundle/
      #     <executable>              ← main binary
      #     lib/                      ← Flutter runtime + app .so files
      #     data/flutter_assets/      ← Flutter assets and Dart AOT snapshot
      # =====================================================================
      - name: Build AppImage (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          APPDIR=Switch-Queue-Copy.AppDir
          BINARY_NAME='switch-queue-copy'

          # 1) Locate the Flutter bundle output --------------------------------
          BUNDLE_DIR=$(find build/linux -type d -name bundle | head -1)
          if [ -z "$BUNDLE_DIR" ]; then
            echo "::error::Could not locate Flutter bundle dir under build/linux/"
            find build/linux -maxdepth 5 -type d
            exit 1
          fi
          echo "Bundle dir: $BUNDLE_DIR"
          ls -la "$BUNDLE_DIR"

          # Auto-detect the actual executable name (whatever --artifact resolved to).
          BUNDLE_BIN=$(find "$BUNDLE_DIR" -maxdepth 1 -type f -executable -not -name '*.so*' | head -1)
          if [ -z "$BUNDLE_BIN" ]; then
            echo "::error::No executable found at top level of $BUNDLE_DIR"
            exit 1
          fi
          BUNDLE_BIN_NAME=$(basename "$BUNDLE_BIN")
          echo "Bundle binary: $BUNDLE_BIN_NAME"

          # 2) AppDir skeleton --------------------------------------------------
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps" \
                   "$APPDIR/usr/share/$BINARY_NAME"

          # 3) Copy the entire Flutter bundle into usr/share/<app>/ -----------
          # We keep the bundle intact so Flutter can find data/ and lib/ via
          # relative paths from the binary's location. usr/share is the
          # AppImage-spec-friendly home for app data; we'll launch via a
          # wrapper in usr/bin that cd's here first.
          cp -r "$BUNDLE_DIR"/. "$APPDIR/usr/share/$BINARY_NAME/"

          # 4) Wrapper in usr/bin that cd's into the bundle and execs ---------
          cat > "$APPDIR/usr/bin/$BINARY_NAME" <<EOF
          #!/bin/bash
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          cd "\$HERE/../share/$BINARY_NAME"
          exec "./$BUNDLE_BIN_NAME" "\$@"
          EOF
          chmod +x "$APPDIR/usr/bin/$BINARY_NAME"

          # 5) .desktop file ----------------------------------------------------
          cat > "$APPDIR/$BINARY_NAME.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Switch Queue Copy
          Comment=Serial file-copy tool for Nintendo Switch libraries with auto-classification
          Exec=$BINARY_NAME
          Icon=$BINARY_NAME
          Categories=Utility;FileTransfer;
          Terminal=false
          EOF
          cp "$APPDIR/$BINARY_NAME.desktop" "$APPDIR/usr/share/applications/$BINARY_NAME.desktop"

          # 6) Icon — placeholder via ImageMagick if no real icon shipped -----
          if [ -f assets/icon.png ]; then
            cp assets/icon.png "$APPDIR/$BINARY_NAME.png"
          else
            convert -size 256x256 xc:'#1e1e3c' "$APPDIR/$BINARY_NAME.png"
          fi
          cp "$APPDIR/$BINARY_NAME.png" "$APPDIR/usr/share/icons/hicolor/256x256/apps/$BINARY_NAME.png"

          # 7) AppRun: minimal — just call the wrapper -------------------------
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
          export XDG_DATA_DIRS="$HERE/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"
          exec "$HERE/usr/bin/switch-queue-copy" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          # 8) linuxdeploy: walk deps of the *real* bundle binary, bundle libs --
          wget -nv -O linuxdeploy.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod +x linuxdeploy.AppImage
          # Point --executable at the actual ELF inside the bundle (not the wrapper
          # script), so linuxdeploy's dependency walker has something to chew on.
          # We pass the wrapper-script path as well via NO_STRIP=1 so linuxdeploy
          # doesn't try to strip our shell scripts.
          NO_STRIP=1 ./linuxdeploy.AppImage \
            --appdir "$APPDIR" \
            --executable "$APPDIR/usr/share/$BINARY_NAME/$BUNDLE_BIN_NAME" \
            --desktop-file "$APPDIR/$BINARY_NAME.desktop" \
            --icon-file "$APPDIR/$BINARY_NAME.png"

          # 9) Final .AppImage -------------------------------------------------
          wget -nv -O appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool.AppImage
          mkdir -p dist
          ./appimagetool.AppImage "$APPDIR" "dist/Switch-Queue-Copy-x86_64.AppImage"

          ls -lh dist/Switch-Queue-Copy-x86_64.AppImage
          file dist/Switch-Queue-Copy-x86_64.AppImage

      - name: Stage artifact under release name
        id: stage
        shell: bash
        run: |
          mkdir -p release-assets
          ASSET_NAME='${{ matrix.asset_name_template }}'
          ASSET_NAME="${ASSET_NAME/\{version\}/${{ steps.version.outputs.version }}}"
          cp "${{ matrix.built_path }}" "release-assets/$ASSET_NAME"
          chmod +x "release-assets/$ASSET_NAME" 2>/dev/null || true
          echo "name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Staged:"
          ls -lh release-assets/

      - name: Create / update GitHub Release & upload asset
        uses: softprops/action-gh-release@v2
        with:
          # Creates the release (and tag, if dispatched manually) on the
          # first matrix-job; later jobs append their assets to the same
          # release tag.
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/${{ steps.stage.outputs.name }}
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
