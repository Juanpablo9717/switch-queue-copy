name: Release

# Two ways to trigger this workflow:
#
#   1. Push a tag like `v0.1.0` from your machine:
#        git tag v0.1.0 -m "..."
#        git push origin v0.1.0
#
#   2. Click "Run workflow" in the Actions tab of the repo and type
#      the version (e.g. `0.1.0`). Useful when you're on a machine
#      without git, or when you'd rather do it from the browser.
#
# Either way, the job:
#   1. Spins up one Windows and one Linux runner in parallel.
#   2. Runs the full pytest suite as a gate.
#   3. Bundles the app with `flet pack` (PyInstaller under the hood).
#   4. Renames the output to a versioned, platform-tagged filename.
#   5. Attaches it as an asset on a GitHub Release for that tag
#      (creating the release + tag if they don't exist), with
#      auto-generated changelog from commit messages.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0 — without the v prefix, it is added automatically)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

# We need write access to push the release + assets + tag.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name_template: switch-queue-copy-{version}-windows-x64.exe
            built_path: dist/Switch Queue Copy.exe
          - os: ubuntu-latest
            asset_name_template: switch-queue-copy-{version}-linux-x64
            built_path: dist/Switch Queue Copy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Flet's Linux runtime needs GTK + libmpv at *bundle* time so
      # PyInstaller can resolve the shared libs to embed. We install
      # best-effort — different Ubuntu LTSes name them differently and
      # we don't want a missing package on the runner to fail the build
      # before flet pack even runs.
      - name: Install Linux system libs
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libayatana-appindicator3-1 \
            || true
          sudo apt-get install -y libmpv2 || sudo apt-get install -y libmpv1 || true

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (gate)
        run: pytest -v

      - name: Compute version + tag
        id: version
        shell: bash
        run: |
          # We accept two trigger flavours:
          #   - workflow_dispatch: read the input (e.g. "0.1.0" — strip leading v if user added it)
          #   - tag push (refs/tags/v0.1.0): take github.ref_name and strip v for the embedded version
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW='${{ inputs.version }}'
            VERSION="${RAW#v}"
            TAG="v$VERSION"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          # Minimal sanity check — SemVer X.Y.Z (optionally followed by -rc1, -beta, etc.)
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$'; then
            echo "::error::Version '$VERSION' is not valid SemVer (expected X.Y.Z[-suffix])."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION (tag $TAG)"

      - name: Build with flet pack
        shell: bash
        run: |
          flet pack switch_queue/__main__.py \
            --name "Switch Queue Copy" \
            --product-name "Switch Queue Copy" \
            --product-version "${{ steps.version.outputs.version }}" \
            --file-version "${{ steps.version.outputs.version }}" \
            --yes

      - name: Stage artifact under release name
        id: stage
        shell: bash
        run: |
          mkdir -p release-assets
          ASSET_NAME='${{ matrix.asset_name_template }}'
          ASSET_NAME="${ASSET_NAME/\{version\}/${{ steps.version.outputs.version }}}"
          cp "${{ matrix.built_path }}" "release-assets/$ASSET_NAME"
          chmod +x "release-assets/$ASSET_NAME" 2>/dev/null || true
          echo "name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Staged:"
          ls -lh release-assets/

      - name: Create / update GitHub Release & upload asset
        uses: softprops/action-gh-release@v2
        with:
          # Creates the release (and tag, if dispatched manually) on the
          # first matrix-job; later jobs append their assets to the same
          # release tag.
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/${{ steps.stage.outputs.name }}
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
